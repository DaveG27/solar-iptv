<style>

/* ---------- top bar ---------- */
#top{position:absolute;left:0;right:0;top:0;height:112px;background:linear-gradient(180deg,#04050cd9 0,#04050c80 60%,transparent);display:flex;align-items:center;padding:0 72px 0 80px;gap:14px;z-index:6}

nav{display:flex;gap:2px}

.tr{margin-left:auto;display:flex;align-items:center;gap:14px}
.clock{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;margin:0 6px;opacity:.95}

.view{position:absolute;left:0;right:0;top:112px;bottom:0}

.btn{height:62px;padding:0 30px;border-radius:31px;background:#ffffff1f;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:inline-flex;align-items:center;gap:12px;font-size:22px;font-weight:700;color:#fff;transition:transform .18s,background .18s;white-space:nowrap;flex:none;cursor:pointer}

 -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 44%),linear-gradient(0deg,transparent 0,#000 40%);-webkit-mask-composite:source-in;
 mask-image:linear-gradient(90deg,transparent 0,#000 44%),linear-gradient(0deg,transparent 0,#000 40%);mask-composite:intersect}

.bb-txt{position:absolute;left:90px;top:22px;width:880px}

.rails{position:absolute;left:0;right:0;top:480px;bottom:0;overflow:hidden}
.rails-in{transition:transform .5s cubic-bezier(.2,.8,.2,1)}

.t{position:relative;flex:none;width:384px;height:216px;border-radius:14px;overflow:hidden;background:#151a33;transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .24s;box-shadow:0 10px 26px #0006;cursor:pointer}

.t.po{width:232px;height:348px}

.art{position:absolute;inset:0;overflow:hidden}

.po .wm{text-align:center;bottom:30px}

.ff-serif{font-family:'Playfair Display',Georgia,serif;font-weight:800;text-transform:uppercase;letter-spacing:2px;font-size:.84em}

.lb.cu{background:#3a7bff}.lb.soon{background:#0008;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.lb.new{background:#14c47a}

.t10{flex:none;display:flex;align-items:flex-end}

.t.mood{width:290px;height:170px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 22px}

.t.mt{width:440px;height:216px;padding:18px 22px;background:linear-gradient(105deg,hsl(var(--ha) 70% 28%),#0c1028 48%,#0c1028 52%,hsl(var(--hb) 70% 28%))}
.mt-top{display:flex;justify-content:space-between;font-size:16px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#ffffffb0}
.mt-st{padding:3px 9px;border-radius:6px;background:#ffffff1f;color:#fff}.mt-st.live{background:#ff1f4b}

.vs{overflow:hidden;position:absolute}

.grid{display:grid;grid-template-columns:repeat(4,384px);gap:30px 24px;padding:18px 90px 40px}

.g-head{position:absolute;left:90px;right:90px;top:4px;height:280px;display:flex;gap:42px}

.g-grid{position:absolute;left:90px;right:90px;top:372px;bottom:0}

.g-area{position:absolute;left:246px;right:0;top:0;bottom:0;overflow:hidden}
.g-in{position:absolute;left:0;top:0;transition:transform .28s cubic-bezier(.2,.8,.2,1)}

.g-rows{position:absolute;top:44px;left:0}
.g-row{position:absolute;left:0;height:84px}
.gc{position:absolute;top:6px;height:72px;border-radius:11px;background:#ffffff12;padding:11px 14px;overflow:hidden;white-space:nowrap;cursor:pointer;transition:background .14s}

.gc span{font-size:16px;color:#ffffff90;font-weight:600;display:flex;gap:8px;align-items:center}

.gpast{position:absolute;top:44px;left:0;height:6000px;background:#00000038;pointer-events:none}

.tm-head{position:absolute;left:90px;top:0;right:90px;display:flex;align-items:flex-end;justify-content:space-between}
.tm-head h1{font-size:68px;font-weight:900;letter-spacing:-1.5px}

.slot.nowslot{background:#ff1f4b40;box-shadow:inset 0 0 0 2px #ff1f4b}

.mv-grid{position:absolute;left:90px;top:16px;width:1290px;height:726px}

#modal{position:absolute;inset:0;z-index:60;display:none;background:#02030ad0;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

.aur{position:absolute;inset:-25%;background:radial-gradient(38% 48% at 30% 40%,hsl(var(--h) 90% 55% / .55),transparent 70%),radial-gradient(34% 44% at 70% 58%,#ff3d9a66,transparent 70%),radial-gradient(40% 40% at 52% 82%,#18e0c055,transparent 70%),radial-gradient(30% 30% at 80% 20%,#ffb34744,transparent 70%);filter:blur(30px);animation:aur 26s ease-in-out infinite alternate}
@keyframes aur{0%{transform:rotate(0) scale(1)}50%{transform:rotate(22deg) scale(1.18) translate(4%,-3%)}100%{transform:rotate(-14deg) scale(1.06) translate(-5%,4%)}}
.fr-clock{position:absolute;left:120px;bottom:210px;font-size:250px;font-weight:200;letter-spacing:-10px;line-height:1;font-variant-numeric:tabular-nums}

.tk-in{display:flex;gap:60px;white-space:nowrap;animation:tk 60s linear infinite;padding-left:40px;font-size:20px;font-weight:700}

@keyframes tk{to{transform:translateX(-50%)}}

.tvbox *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

.tvbox #stage{transition:none}

.tvbox #amb::after{display:none}

.tvbox .bb-art::after,.tvbox .bb-live::after,.tvbox .dt-art::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#05060f 0,#05060fd9 30%,#05060f00 62%),linear-gradient(0deg,#05060f 0,#05060f00 42%),linear-gradient(180deg,#05060fcc 0,#05060f00 22%);pointer-events:none}
.tvbox .t{transition:transform .13s ease-out;box-shadow:none}

.tvbox .toast,.tvbox #modal.on{animation:none}
.tvbox #modal{background:#02030af2}
.tvbox .gc{transition:none}
.o-tech{display:inline-flex;gap:8px;margin-left:14px;vertical-align:middle}

  case 'mount':s=`<circle cx="${105+r()*35}" cy="${22+r()*8}" r="9" fill="${A}" opacity=".9"/><polygon points="0,90 0,56 22,40 42,54 70,28 96,50 122,34 160,58 160,90" fill="hsl(${h} 45% 24%)" opacity=".92"/><polygon points="0,90 0,70 30,56 58,72 90,50 124,70 160,62 160,90" fill="${D}"/>`;break;
  case 'rings':{const cx=104+r()*36,cy=28+r()*30;for(let i=1;i<10;i++)s+=`<circle cx="${cx}" cy="${cy}" r="${i*8.5}" fill="none" stroke="${B}" stroke-opacity="${(.55-i*.05).toFixed(2)}" stroke-width=".7"/>`;s+=`<circle cx="${cx}" cy="${cy}" r="4.5" fill="${A}"/>`;break}
  case 'grid':{s=`<circle cx="${100+r()*30}" cy="42" r="17" fill="${B}" opacity=".85"/><rect x="0" y="48" width="160" height="42" fill="${D}"/>`;for(let i=-9;i<=9;i++)s+=`<line x1="${110}" y1="48" x2="${110+i*22}" y2="90" stroke="${A}" stroke-opacity=".6" stroke-width=".5"/>`;[51,55,61,70,84].forEach(y=>s+=`<line x1="0" y1="${y}" x2="160" y2="${y}" stroke="${A}" stroke-opacity=".55" stroke-width=".5"/>`);break}
  case 'stars':{for(let i=0;i<45;i++)s+=`<circle cx="${(r()*160).toFixed(1)}" cy="${(r()*90).toFixed(1)}" r="${(r()*.7+.2).toFixed(2)}" fill="#fff" opacity="${(r()*.8+.2).toFixed(2)}"/>`;s+=`<circle cx="120" cy="40" r="20" fill="${B}"/><ellipse cx="120" cy="40" rx="34" ry="6" fill="none" stroke="${A}" stroke-width="1.4" opacity=".8"/>`;break}
  case 'blob':for(let i=0;i<4;i++)s+=`<circle cx="${(80+r()*80).toFixed(1)}" cy="${(r()*90).toFixed(1)}" r="${(16+r()*22).toFixed(1)}" fill="${i%2?A:B}" opacity="${(.35+r()*.35).toFixed(2)}"/>`;for(let i=0;i<10;i++)s+=`<rect x="${(r()*160).toFixed(1)}" y="${(r()*90).toFixed(1)}" width="2.5" height="2.5" rx=".6" fill="#fff" opacity=".6" transform="rotate(${(r()*90)|0})"/>`;break;
  case 'stripes':for(let i=0;i<9;i++)s+=`<polygon points="${60+i*14},0 ${70+i*14},0 ${40+i*14},90 ${30+i*14},90" fill="${i%2?A:B}" opacity="${(.18+i*.05).toFixed(2)}"/>`;break;
  case 'bubbles':for(let i=0;i<15;i++){const x=(r()*160).toFixed(1),y=(r()*90).toFixed(1),rr=(4+r()*13).toFixed(1);s+=`<circle cx="${x}" cy="${y}" r="${rr}" fill="hsl(${(r()*360)|0} 90% 64%)" opacity=".88"/><circle cx="${x-rr*.3}" cy="${y-rr*.3}" r="${rr*.25}" fill="#fff" opacity=".5"/>`}break;
  case 'globe':{const cx=118,cy=44,R=32;s=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${B}" fill-opacity=".12" stroke="${B}" stroke-width=".8"/>`;[.25,.55,.85].forEach(k=>s+=`<ellipse cx="${cx}" cy="${cy}" rx="${R*k}" ry="${R}" fill="none" stroke="${B}" stroke-opacity=".6" stroke-width=".5"/>`);[-16,0,16].forEach(d=>s+=`<line x1="${cx-Math.sqrt(R*R-d*d)}" y1="${cy+d}" x2="${cx+Math.sqrt(R*R-d*d)}" y2="${cy+d}" stroke="${B}" stroke-opacity=".6" stroke-width=".5"/>`);break}
  case 'bars':for(let i=0;i<20;i++){const bh=8+r()*58;s+=`<rect x="${i*8+1}" y="${90-bh}" width="5.5" height="${bh}" rx="1.5" fill="${i%3?A:B}" opacity="${(.45+r()*.45).toFixed(2)}"/>`}break;

function tile(o,opt={}){
 const t=now();let over='',cls=opt.cls||'';
 if(o.kind==='prog'){
  const live=isLive(o);
  if(live){over+=`<div class="lb">LIVE</div><div class="ov"><div class="pb"><i data-s="${o.start}" data-e="${o.end}" style="width:${pct(o)}%"></i></div></div>`;cls+=' haspb'}
  else if(o.end<=t)over+=canCatch(o)?`<div class="lb cu">Catch up</div>`:`<div class="lb soon">Earlier</div>`;
  else over+=`<div class="lb soon">${o.start-t<3*HR?'In '+fmtIn(o.start-t):dayLbl(o.start)+' '+fmtT(o.start)}</div>`;
  over+=`<div class="cb">${o.ch.num}</div>`;
 }else if(o.kind==='channel'){const p=liveProg(o);over+=`<div class="lb">LIVE</div><div class="cb">${o.num}</div>`;if(p&&p.title!==o.name)over+=`<div class="ov" style="font-size:17px;font-weight:700;opacity:.85;padding-bottom:10px">${esc(p.title)}</div>`}
 else if(o.kind==='ep'){over+=`<div class="cb">${esc(o.se)}</div>`}
 if(opt.prog!=null){over+=`<div class="ov"><div class="pb"><i style="width:${opt.prog*100}%"></i></div></div>`;cls+=' haspb'}
 if(opt.badge)over+=`<div class="lb new">${opt.badge}</div>`;
 return `<div class="t f ${cls}" data-a="open" data-id="${o.id}">${art(o,cls.includes('po')?'po':'la')}${over}</div>`;
}

/* ---------- focus engine ---------- */
let FOC=null;const MEM={};
const DIRS={up:1,down:1,left:1,right:1};
function vis(e){return e.offsetParent!==null||e.getClientRects().length>0}
function setFocus(el){if(!el)return;if(FOC&&FOC!==el)FOC.classList.remove('foc');FOC=el;el.classList.add('foc');afterFocus(el)}
function scopeEl(){if($('#modal').classList.contains('on'))return $('#modal');if(SURF.open)return $('#surf');if(P.open&&!P.pip)return $('#osd');return $('#ui')}
function moveFast(dir){
 if(!FOC||modalOn()||!$('#view').contains(FOC))return false;
 const tr=FOC.closest('.track');if(!tr)return false;
 if(dir==='left'||dir==='right'){const L=$$('.f',tr);const i=L.indexOf(FOC);if(i<0)return false;
  if(dir==='right'&&i===L.length-1){railFill(tr);const L2=$$('.f',tr);if(L2.length>L.length){setFocus(L2[i+1]);return true}return true}
  const nx=L[i+(dir==='right'?1:-1)];if(nx){setFocus(nx);return true}return dir==='right'}
 const rl=tr.closest('.rail');if(!rl)return false;
 let n=dir==='down'?rl.nextElementSibling:rl.previousElementSibling;while(n&&!n.querySelector('.f'))n=dir==='down'?n.nextElementSibling:n.previousElementSibling;
 if(!n||!n.classList.contains('rail'))return false;
 const r=FOC.getBoundingClientRect(),cx=r.left+r.width/2;let best=null,bd=1e12;
 for(const c of $$('.f',n)){const q=c.getBoundingClientRect();if(!q.width)continue;const d=Math.abs(q.left+q.width/2-cx);if(d<bd){bd=d;best=c}}
 if(best){setFocus(best);return true}return false}
function move(dir){
 if(moveFast(dir))return;
 const root=scopeEl();const cs=$$('.f',root).filter(vis);if(!cs.length)return;
 if(!FOC||!root.contains(FOC)||!vis(FOC)){setFocus(cs[0]);return}
 if(dir==='down'&&$('#top').contains(FOC)){enterView();return}
 const r=FOC.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,tol=12;
 let best=null,bs=1e12;
 for(const c of cs){if(c===FOC)continue;const q=c.getBoundingClientRect();if(!q.width)continue;const qx=q.left+q.width/2,qy=q.top+q.height/2;let p,s;
  if(dir==='right'||dir==='left'){
   if(dir==='right'?q.left<r.right-tol:q.right>r.left+tol)continue;
   if(!(q.top<r.bottom-4&&q.bottom>r.top+4))continue;
   p=dir==='right'?q.left-r.right:r.left-q.right;s=Math.abs(qy-cy)*.5;
  }else{
   if(dir==='down'?q.top<r.bottom-tol:q.bottom>r.top+tol)continue;
   p=dir==='down'?q.top-r.bottom:r.top-q.bottom;
   const ov=q.left<r.right&&q.right>r.left;s=ov?Math.abs(qx-cx)*.15:Math.abs(qx-cx)*1.2+200;
  }
  const sc=Math.max(0,p)+s;if(sc<bs){bs=sc;best=c}}
 if(best){if(best.closest('#top')&&!$('#top').contains(FOC)){best=$('#top .nv.cur')||$('#top .nvs')||best}setFocus(best)}
}

  [/(funny|comed|laugh|lol|hilarious|sitcom)/,'mood','laugh','😂 Funny'],[/(scary|horror|scare|creepy|spooky)/,'mood','scare','👻 Scary'],[/(thrill|tense|edge of|action|exciting|gripping)/,'mood','thrill','⚡ Thrilling'],[/(relax|chill|unwind|calm|cosy|cozy)/,'mood','chill','🌙 Relaxing'],[/(mind|sci.?fi|space|future|trippy)/,'mood','mind','🤯 Mind-bending'],[/(feel.?good|happy|uplifting|cheer)/,'mood','feel','🌈 Feel-good'],[/(date|romantic|romance|love)/,'mood','date','💞 Romantic'],[/(learn|documentar|docs?\b|history|nature|animals|teach|science)/,'mood','learn','🧠 Learn something'],
  [/(kids|cartoon|children|family)/,'cat','kids','🧸 Kids & family'],[/\b(news|headlines)\b/,'cat','news','📰 News'],[/\b(music|songs|hits)\b/,'cat','music','🎵 Music'],[/\b(movie|film)s?\b/,'kind','movie','🎬 Movies'],[/\b(box ?sets?|series|binge)\b/,'kind','series','📺 Box sets'],[/\bcrime\b/,'genre','Crime','🔎 Crime'],[/\bdrama\b/,'genre','Drama','🎭 Drama']];
 for(const [re,ty,v,l] of T)if(re.test(q)){({pool:f.pools,cat:f.cats,mood:f.moods,kind:f.kinds,genre:f.genres})[ty].add(v);und.push(l)}

const SCREENS=new Set();

 else{killVideo(sc);if(!sc.cv){sc.cv=document.createElement('canvas');sc.cv.width=sc.w;sc.cv.height=sc.h;sc.ctx=sc.cv.getContext('2d');sc.host.appendChild(sc.cv)}SCREENS.add(sc)}
}

function techInfo(){const sc=P.sc,v=sc&&sc.video;if(!v)return[];const out=[];const h=sc.hls;let lv=null;
 try{if(h&&h.levels&&h.levels.length){const i=h.currentLevel>=0?h.currentLevel:(h.loadLevel>=0?h.loadLevel:0);lv=h.levels[i]||null}}catch(e){}

 if(H)out.push(H>=2000?'4K UHD':H>=1400?'1440p':H>=1000?'1080p':H>=700?'720p':H>=540?'576p SD':H+'p');
 let fps=lv&&(lv.frameRate||parseFloat(lv.attrs&&lv.attrs['FRAME-RATE']));
 if(!fps&&v.getVideoPlaybackQuality){const q=v.getVideoPlaybackQuality(),tm=performance.now();const m=sc._fm;if(m&&tm-m.t>900&&q.totalVideoFrames>m.f){sc._fps=(q.totalVideoFrames-m.f)/((tm-m.t)/1000);sc._fm={f:q.totalVideoFrames,t:tm}}else if(!m)sc._fm={f:q.totalVideoFrames,t:tm};fps=sc._fps}
 if(fps)out.push((fps>47&&fps<53?50:fps>57&&fps<63?60:fps>23&&fps<26.5?Math.round(fps):fps>28&&fps<31?30:Math.round(fps))+'fps');
 if(lv&&lv.bitrate)out.push((lv.bitrate/1e6).toFixed(lv.bitrate<1e7?1:0)+' Mbps');
 const vc=(lv&&(lv.videoCodec||lv.attrs&&lv.attrs.CODECS)||'').toLowerCase();
 if(/hvc1|hev1/.test(vc))out.push('HEVC');else if(/avc1/.test(vc))out.push('H.264');else if(/av01/.test(vc))out.push('AV1');
 let ac=(lv&&lv.audioCodec||'').toLowerCase(),chn='';
 try{const at=h&&h.audioTracks&&h.audioTracks[h.audioTrack];if(at){chn=at.attrs&&at.attrs.CHANNELS||'';if(!ac&&at.audioCodec)ac=at.audioCodec.toLowerCase()}}catch(e){}

 const an=/ec-3/.test(ac)?'Dolby Digital+':/ac-3/.test(ac)?'Dolby Digital':/mp4a/.test(ac)?'AAC':'';

 return out}

function recap(p,mins){
 const r=rng(hash(p.id+'recap'));
 if(p.match){const st=matchState(p),m=p.match;if(st.min<0)return['The build-up is still on — kick-off at '+fmtT(p.start+15*MIN)+'.','Team news: both sides at full strength.'];if(spoil(p))return['Spoiler Shield is on, so the goals stay hidden.',`It's ${st.label==='HT'?'half time':st.ft?'full time':st.min+' minutes in'} — and it's been end-to-end.`,'Reveal the score from the player when you are ready.'];
  const out=st.goals.map(g=>`${g.min}' — GOAL! ${g.who} scores for ${g.side?m.b.n:m.a.n}.`);if(!out.length)out.push(`No goals yet after ${st.min} minutes — ${pick(r,[m.a.n,m.b.n])} have had the better chances.`);out.push(`Score: ${m.a.n} ${st.sa}–${st.sb} ${m.b.n} · possession ${m.pos}%–${100-m.pos}%.`);return out}
 const key=p.ch.cat==='movie'?'movie':BEATMAP[p.pool]||(BEATS[p.pool]?p.pool:'generic');const B=BEATS[key];const n=clamp(1+Math.floor(mins/14),1,Math.min(4,B.length));const out=[];const used=new Set();while(out.length<n){const i=Math.floor(r()*B.length);if(used.has(i))continue;used.add(i);out.push(fillT(B[i],r))}return out}
function openCatchup(){const p=curProg();if(!p){toast('Nothing to catch up on here');return}const mins=Math.max(1,Math.round((now()-p.start)/MIN)),left=Math.max(0,Math.round((p.end-now())/MIN)),nx=nextProg(p.ch,p);
 const fromStart=canCatch(p)?btn('cuStart','restart','Watch from the start',p.id):'';
 let body;
 if(S.source==='xt'){const d=(p.desc||'').trim();const real=d&&!/^Guide information/i.test(d);
  body=`<p class="mut">You've joined ${mins} minute${mins>1?'s':''} in · ${left} min left${nx?` · then ${esc(nx.title)} at ${fmtT(nx.start)}`:''}.</p>`+(real?`<div class="kick" style="margin-top:22px"><span class="pill">ABOUT THIS PROGRAMME</span><span>from the TV guide</span></div><p style="margin-top:12px;max-height:240px;overflow:hidden">${esc(d)}</p>`:`<p style="margin-top:18px">Your provider hasn't sent a description for this programme, so there's nothing to recap.</p>`)+(canCatch(p)?'':`<p class="mut" style="margin-top:14px;font-size:19px">This channel isn't recorded by your provider, so it can't be watched from the start.</p>`)}
 else body=`<p class="mut">You've joined ${mins} minute${mins>1?'s':''} in. Here's the story so far (demo channel):</p><ul class="beats">${recap(p,mins).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 openModal(`<div class="mcard"><div class="kick"><span class="pill">${IC.spark} CATCH ME UP</span><span>${p.ch.num} ${esc(p.ch.name)}</span></div><h2>${esc(p.title)}</h2>${body}<div class="mbtns">${fromStart}${btn('closeModal','play','Carry on live',null,fromStart?'':'pri')}</div></div>`)}

 const arr=x=>Array.isArray(x)?x:[];const lcn={};arr(lc).forEach(x=>lcn[x.category_id]=x.category_name);

function keyName(e){const k=e.key,c=e.keyCode;
 if(k==='ArrowUp'||c===38)return'up';if(k==='ArrowDown'||c===40)return'down';if(k==='ArrowLeft'||c===37)return'left';if(k==='ArrowRight'||c===39)return'right';
 if(k==='Enter'||c===13||c===23)return'enter';
 if(k==='Escape'||k==='Backspace'||k==='GoBack'||k==='BrowserBack'||c===4||c===461||c===10009||c===27||c===8)return'back';
 if(k==='PageUp'||k==='ChannelUp'||c===33||c===427)return'chup';if(k==='PageDown'||k==='ChannelDown'||c===34||c===428)return'chdown';
 if(k==='MediaPlayPause'||k==='MediaPlay'||c===179||c===85||c===415||k==='p'||k==='P')return'play';
 if(/^[0-9]$/.test(k))return'd'+k;return null}
document.addEventListener('keydown',e=>{
 lastAct=now();lastKey=now();const ae=document.activeElement,inInput=ae&&/INPUT|TEXTAREA/.test(ae.tagName);
 if(inInput){if(e.key==='Enter'||e.key==='Escape'){ae.blur();e.preventDefault();return}if(e.key==='ArrowUp'||e.key==='ArrowDown'){ae.blur()}else return}
 if(frameOn){e.preventDefault();frameOff();return}
 const searching=S.view==='search'&&!modalOn()&&!(P.open&&!P.pip)&&!SURF.open;
 if(searching&&e.key.length===1&&/[a-z0-9 ]/i.test(e.key)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();searchType(e.key===' '?'SPACE':e.key);return}
 if(searching&&e.key==='Backspace'&&Q.q.length){e.preventDefault();searchType('DEL');return}
 const k=keyName(e);if(!k)return;e.preventDefault();
 if(k==='up'||k==='down'||k==='left'||k==='right'){if(KPEND){KPEND=k;return}KPEND=k;requestAnimationFrame(()=>{const kk=KPEND;KPEND=null;handle(kk)});return}
 handle(k);
});
let KPEND=null;
function handle(k){
 if(k[0]==='d'&&k.length===2)return digit(k[1]);
 if(k==='guide'){if(frameOn)frameOff();if(SURF.open)surfClose(true);if(modalOn())closeModal(true);if(P.open&&!P.pip)minimize();return go('guide')}
 if(modalOn()){if(k==='back')return closeModal();if(k==='enter')return activate(FOC);if(DIRS[k])return move(k);return}
 if(SURF.open)return surfKey(k);
 if(P.open&&!P.pip)return playerKey(k);
 if(k==='play'){if(P.pip)return pipExpand();return}
 if(k==='chup'||k==='chdown'){if(V[S.view]?.key?.(k))return;if(P.pip){pipExpand();zap(k==='chup'?1:-1)}return}
 if(k==='back')return back();
 if(k==='enter')return activate(FOC);
 if(V[S.view]?.key?.(k))return;
 if(DIRS[k])move(k);
}
function back(){if($('#view').contains(FOC)){setFocus($('#top .nv.cur')||$('#top .nvs'));return}if(S.view!=='home'){go('home',{keepTop:true});return}if(P.pip)return pipClose();if(window.Android)openModal(`<div class="mcard" style="width:720px"><h2>Leave PRIMO?</h2><p class="mut">Your settings, playlist and provider login are saved.</p><div class="mbtns">${btn('closeModal','tv','Keep watching',null,'pri')}${btn('appExit','close','Exit')}</div></div>`)}
let chBuf='',chT;
function digit(d){if(SURF.open||modalOn())return;chBuf+=d;const ce=$('#chentry');ce.textContent=chBuf.padEnd(3,'–');ce.style.display='block';clearTimeout(chT);if(chBuf.length>=3)commitCh();else chT=setTimeout(commitCh,1500)}
function commitCh(){clearTimeout(chT);const n=+chBuf;chBuf='';$('#chentry').style.display='none';const L=chans();const ch=L.find(c=>c.num===n)||L.find(c=>c.num>=n);if(!ch)return toast(`No channel ${n}`,'close');playChannel(ch)}
$('#stage').addEventListener('click',e=>{if(now()-lastKey<600)return; // the remote's OK also fires a click on some boxes: it's the same press, already handled
 lastAct=now();if(frameOn){frameOff();return}if(P.pip&&e.target.closest('#player')){pipExpand();return}if(P.open&&!P.pip&&!e.target.closest('.f')&&!modalOn()&&e.target.closest('#player')){P.osd?hideOSD():showOSD(true);return}const f=e.target.closest('.f');if(!f)return;if(f.tagName==='INPUT'){setFocus(f);return}setFocus(f);activate(f)});
$('#stage').addEventListener('mousemove',e=>{const f=e.target.closest('.f');if(f&&f!==FOC&&scopeEl().contains(f)&&!f.classList.contains('nv')&&!f.classList.contains('nvs'))setFocus(f)});
$('#player .pback').innerHTML=IC.back;$('#player .pback').classList.add('f');

/* ---------- timers ---------- */
setInterval(()=>{const c=$('#clock');if(c)c.textContent=fmtT(now());const fc=$('#frc');if(fc)fc.textContent=fmtT(now());$$('[data-s][data-e]').forEach(i=>{if(i.tagName==='I')i.style.width=clamp((now()-+i.dataset.s)/(+i.dataset.e-+i.dataset.s)*100,0,100)+'%'});refreshScores()},10000);
setInterval(()=>{
 if(P.open&&P.cur&&P.cur.kind!=='channel'&&!P.pip){P.vodPos+=1;if(Math.floor(P.vodPos)%10===0)saveVod();if(P.osd||$('#osd').classList.contains('show')){const s=$('#osd .o-sub'),b=$('#osd .o-bar i');const dur=(P.cur.mins||60)*60,pos=P.cur.url&&P.sc.video?P.sc.video.currentTime:P.vodPos;if(s)s.textContent=`${fmtClock(pos*1000)} / ${fmtClock(dur*1000)} · ◀ ▶ skip 30s`;if(b)b.style.width=clamp(pos/dur*100,0,100)+'%'}}
 if(P.ret&&now()>=P.ret.at){const ch=P.ret.ch;P.ret=null;if(P.pip||!P.open){playChannel(ch,{quiet:true})}else playChannel(ch,{quiet:true});toast(`Welcome back to ${esc(ch.name)} — your show's on`,'bounce')}
 if(P.sleepAt&&now()>=P.sleepAt){P.sleepAt=0;frameStart()}
 ptopRender();
 if(SURF.open&&SURF.auto&&now()-SURF.last>S.set.autoSurf*1000){SURF.i=(SURF.i+1)%chans().length;surfRender(1)}
 bbRotate();
 if(!frameOn&&!(P.open&&!P.pip)&&!SURF.open&&!modalOn()&&now()-lastAct>180000)frameStart();
},1000);
const NOTIFIED=new Set();
setInterval(()=>{if(modalOn()||SURF.open||frameOn)return;for(const id of S.reminders){const p=REG[id];if(!p||NOTIFIED.has(id))continue;if(p.start-now()<60000&&p.end>now()){NOTIFIED.add(id);openModal(`<div class="mcard"><div class="kick"><span class="pill">${IC.bell} REMINDER</span><span>${p.ch.num} ${esc(p.ch.name)}</span></div><h2>${esc(p.title)} is starting</h2><p class="mut">${fmtT(p.start)} – ${fmtT(p.end)} · ${esc(p.desc)}</p><div class="mbtns">${btn('watchCh','play','Watch now',p.ch.id,'pri')}${btn('closeModal','close','Not now')}</div></div>`);break}}},8000);

/* ---------- boot ---------- */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
try{if(window.top===window){history.pushState({n:1},'');addEventListener('popstate',()=>{handle('back');history.pushState({n:1},'')})}}catch(e){}
genDemo();
go('home');
getProvs();if(S.xtCreds&&S.xtCreds.server){toast(`Connecting to ${esc(provName(S.xtCreds))}…`,'tv');xtLoad(S.xtCreds).then(r=>{go('home');toast(`Provider connected · ${r.ch} channels`,'check')}).catch(e=>{S.source='demo';genDemo();go('home');toast('Couldn\'t reach your provider — showing demo channels. Settings → TV provider to retry.','close')})}
else if(window.Android)setTimeout(()=>{if(!modalOn())openLogin()},1200);
setTimeout(()=>{if(window.Android&&Android.checkUpdate)Android.checkUpdate(false)},8000);
if(S.set.askProfile&&Object.keys(PROF).length>1)setTimeout(()=>{if(!modalOn())openProfiles()},1500);
requestAnimationFrame(loop);
setTimeout(()=>toast('Remote: arrows · OK · Back · 0–9 for channels · Play/Pause for picture-in-picture','tv'),900);
</script>
</body>
