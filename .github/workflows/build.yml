name: Build Solar IPTV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          set -e
          mkdir -p app/src/main/java/com/solar/iptv app/src/main/assets app/src/main/res/drawable
          cat > settings.gradle <<'XEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'SolarIPTV'
          include ':app'
          XEOF
          cat > build.gradle <<'XEOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          XEOF
          cat > gradle.properties <<'XEOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          XEOF
          cat > app/build.gradle <<'XEOF'
          plugins { id 'com.android.application' }
          def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
          android {
              namespace 'com.solar.iptv'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.solar.iptv'
                  minSdk 22
                  targetSdk 34
                  versionCode run
                  versionName "1.0.${run}"
              }
              signingConfigs {
                  solar { storeFile file('solar.jks'); storePassword 'solarsolar'; keyAlias 'solar'; keyPassword 'solarsolar' }
              }
              buildTypes {
                  release { minifyEnabled false; signingConfig signingConfigs.solar }
                  debug { signingConfig signingConfigs.solar }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
              implementation 'androidx.media3:media3-ui:1.4.1'
          }
          XEOF
          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="Solar IPTV"
                  android:icon="@drawable/icon"
                  android:banner="@drawable/banner"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:screenOrientation="landscape"
                      android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode" />
              </application>
          </manifest>
          XEOF
          cat > app/src/main/java/com/solar/iptv/MainActivity.java <<'XEOF'
          package com.solar.iptv;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON | WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setUserAgentString(s.getUserAgentString() + " SolarIPTV/1.0");
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  web.requestFocus();
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
                  hideBars();
              }

              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              private class Bridge {
                  @JavascriptInterface
                  public void exit() {
                      runOnUiThread(new Runnable() { public void run() { finish(); } });
                  }

                  /** Play a movie or episode in the native ExoPlayer (handles MKV, AC3/EAC3 audio and buffering). */
                  @JavascriptInterface
                  public void playNative(final String url, final String title, final double startMs, final String id) {
                      runOnUiThread(new Runnable() { public void run() {
                          Intent i = new Intent(MainActivity.this, PlayerActivity.class);
                          i.putExtra("url", url);
                          i.putExtra("title", title);
                          i.putExtra("start", (long) startMs);
                          i.putExtra("id", id);
                          startActivityForResult(i, 42);
                      }});
                  }

                  /** GET a URL natively (follows redirects, ignores CORS) and hand the result back to JS. */
                  @JavascriptInterface
                  public void httpGet(final String id, final String url) {
                      new Thread(new Runnable() { public void run() {
                          int code = 0;
                          String body = "";
                          String err = "";
                          java.net.HttpURLConnection c = null;
                          try {
                              String cur = url;
                              for (int hop = 0; hop < 6; hop++) {
                                  c = (java.net.HttpURLConnection) new java.net.URL(cur).openConnection();
                                  c.setInstanceFollowRedirects(false);
                                  c.setConnectTimeout(15000);
                                  c.setReadTimeout(45000);
                                  // Same browser identity the Reborn TV app uses with this provider
                                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");
                                  c.setRequestProperty("Accept", "*/*");
                                  code = c.getResponseCode();
                                  String loc = c.getHeaderField("Location");
                                  if (code >= 300 && code < 400 && loc != null) {
                                      cur = new java.net.URL(new java.net.URL(cur), loc).toString();
                                      c.disconnect();
                                      continue;
                                  }
                                  break;
                              }
                              java.io.InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                              if (in != null) {
                                  java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream();
                                  byte[] buf = new byte[65536];
                                  int n;
                                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                                  in.close();
                                  body = new String(out.toByteArray(), "UTF-8");
                              }
                          } catch (Exception e) {
                              err = e.getClass().getSimpleName() + (e.getMessage() == null ? "" : ": " + e.getMessage());
                          } finally {
                              if (c != null) c.disconnect();
                          }
                          final String js = "window.__httpDone&&__httpDone(" + org.json.JSONObject.quote(id) + "," + code + ","
                                  + org.json.JSONObject.quote(body) + "," + org.json.JSONObject.quote(err) + ")";
                          runOnUiThread(new Runnable() { public void run() { web.evaluateJavascript(js, null); } });
                      }}).start();
                  }
              }

              private void sendKey(String k) {
                  web.evaluateJavascript("window.handle&&handle('" + k + "')", null);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent e) {
                  String k = null;
                  switch (e.getKeyCode()) {
                      case KeyEvent.KEYCODE_BACK: k = "back"; break;
                      case KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE:
                      case KeyEvent.KEYCODE_MEDIA_PLAY:
                      case KeyEvent.KEYCODE_MEDIA_PAUSE: k = "play"; break;
                      case KeyEvent.KEYCODE_CHANNEL_UP:
                      case KeyEvent.KEYCODE_PAGE_UP: k = "chup"; break;
                      case KeyEvent.KEYCODE_CHANNEL_DOWN:
                      case KeyEvent.KEYCODE_PAGE_DOWN: k = "chdown"; break;
                      case KeyEvent.KEYCODE_MEDIA_FAST_FORWARD: k = "right"; break;
                      case KeyEvent.KEYCODE_MEDIA_REWIND: k = "left"; break;
                      case KeyEvent.KEYCODE_GUIDE: k = "guide"; break;
                      default: break;
                  }
                  if (k != null) {
                      if (e.getAction() == KeyEvent.ACTION_UP) sendKey(k);
                      return true;
                  }
                  return super.dispatchKeyEvent(e);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent d) {
                  super.onActivityResult(req, res, d);
                  if (req != 42 || d == null || web == null) return;
                  String err = d.getStringExtra("err");
                  String js = "window.nativeDone&&nativeDone(" + org.json.JSONObject.quote(String.valueOf(d.getStringExtra("id"))) + ","
                          + d.getLongExtra("pos", 0) + "," + d.getLongExtra("dur", 0) + ","
                          + (err == null ? "null" : org.json.JSONObject.quote(err)) + ")";
                  web.evaluateJavascript(js, null);
              }

              @Override protected void onSaveInstanceState(Bundle out) { super.onSaveInstanceState(out); web.saveState(out); }
              @Override protected void onResume() { super.onResume(); web.onResume(); hideBars(); }
              @Override protected void onPause() { web.onPause(); super.onPause(); }
              @Override protected void onDestroy() { if (web != null) web.destroy(); super.onDestroy(); }
              @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
          }
          XEOF
          cat > app/src/main/java/com/solar/iptv/PlayerActivity.java <<'XEOF'
          package com.solar.iptv;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.media3.common.AudioAttributes;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.DefaultLoadControl;
          import androidx.media3.exoplayer.DefaultRenderersFactory;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.PlayerView;

          @androidx.annotation.OptIn(markerClass = androidx.media3.common.util.UnstableApi.class)
          public class PlayerActivity extends Activity {
              private static final String UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
              private ExoPlayer player;
              private PlayerView view;
              private String id;
              private String err;
              private boolean finished;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON | WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  Intent it = getIntent();
                  String url = it.getStringExtra("url");
                  String title = it.getStringExtra("title");
                  long start = it.getLongExtra("start", 0);
                  id = it.getStringExtra("id");

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  view = new PlayerView(this);
                  root.addView(view, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  final TextView tv = new TextView(this);
                  tv.setText(title == null ? "" : title);
                  tv.setTextColor(Color.WHITE);
                  tv.setTextSize(22);
                  tv.setPadding(56, 40, 56, 0);
                  tv.setShadowLayer(10, 0, 0, Color.BLACK);
                  root.addView(tv, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP));
                  setContentView(root);
                  view.setControllerVisibilityListener(new PlayerView.ControllerVisibilityListener() {
                      @Override public void onVisibilityChanged(int visibility) { tv.setVisibility(visibility); }
                  });

                  DefaultHttpDataSource.Factory http = new DefaultHttpDataSource.Factory()
                          .setUserAgent(UA)
                          .setAllowCrossProtocolRedirects(true)
                          .setConnectTimeoutMs(15000)
                          .setReadTimeoutMs(30000);
                  DefaultLoadControl load = new DefaultLoadControl.Builder()
                          .setBufferDurationsMs(30000, 120000, 2500, 5000)
                          .build();
                  DefaultRenderersFactory renderers = new DefaultRenderersFactory(this)
                          .setEnableDecoderFallback(true)
                          .setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_ON);
                  player = new ExoPlayer.Builder(this, renderers)
                          .setMediaSourceFactory(new DefaultMediaSourceFactory(http))
                          .setLoadControl(load)
                          .setSeekBackIncrementMs(10000)
                          .setSeekForwardIncrementMs(30000)
                          .build();
                  player.setAudioAttributes(new AudioAttributes.Builder().setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MOVIE).build(), true);
                  player.addListener(new Player.Listener() {
                      @Override public void onPlayerError(PlaybackException e) {
                          err = e.getErrorCodeName() + (e.getCause() != null && e.getCause().getMessage() != null ? " (" + e.getCause().getMessage() + ")" : "");
                          Toast.makeText(PlayerActivity.this, "Can't play this: " + err, Toast.LENGTH_LONG).show();
                          done();
                      }
                      @Override public void onPlaybackStateChanged(int state) {
                          if (state == Player.STATE_ENDED) done();
                      }
                  });
                  view.setPlayer(player);
                  view.setShowBuffering(PlayerView.SHOW_BUFFERING_WHEN_PLAYING);
                  view.setKeepScreenOn(true);
                  player.setMediaItem(MediaItem.fromUri(Uri.parse(url)), Math.max(0, start));
                  player.prepare();
                  player.setPlayWhenReady(true);
              }

              private void done() {
                  if (finished) return;
                  finished = true;
                  Intent r = new Intent();
                  r.putExtra("id", id);
                  if (player != null) {
                      r.putExtra("pos", player.getCurrentPosition());
                      long d = player.getDuration();
                      r.putExtra("dur", d == C.TIME_UNSET ? 0L : d);
                  }
                  if (err != null) r.putExtra("err", err);
                  setResult(RESULT_OK, r);
                  finish();
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent e) {
                  if (e.getKeyCode() == KeyEvent.KEYCODE_BACK) {
                      if (e.getAction() == KeyEvent.ACTION_UP) {
                          if (view.isControllerFullyVisible()) view.hideController(); else done();
                      }
                      return true;
                  }
                  if (!view.isControllerFullyVisible() && e.getAction() == KeyEvent.ACTION_DOWN) {
                      int k = e.getKeyCode();
                      if (k == KeyEvent.KEYCODE_DPAD_RIGHT) { player.seekForward(); view.showController(); return true; }
                      if (k == KeyEvent.KEYCODE_DPAD_LEFT) { player.seekBack(); view.showController(); return true; }
                  }
                  return view.dispatchKeyEvent(e) || super.dispatchKeyEvent(e);
              }

              @Override protected void onStop() { super.onStop(); if (player != null && !finished) player.pause(); }
              @Override protected void onDestroy() { if (player != null) { player.release(); player = null; } super.onDestroy(); }
              @Override public void onWindowFocusChanged(boolean f) {
                  super.onWindowFocusChanged(f);
                  if (f) getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }
          }
          XEOF
          cp index.html app/src/main/assets/index.html
          curl -fsSL https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js -o app/src/main/assets/hls.min.js || echo 'hls.js download failed - app will load it online'
          echo '' | base64 -d > app/src/main/res/drawable/banner.png
          echo '' | base64 -d > app/src/main/res/drawable/icon.png
          echo '' | base64 -d > app/solar.jks

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SolarIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SolarIPTV
          path: SolarIPTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Solar IPTV 1.0.${{ github.run_number }}
          make_latest: true
          files: SolarIPTV.apk
