name: Build PRIMO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        env:
          PROVIDER_SERVER: ${{ secrets.PROVIDER_SERVER }}
        run: |
          set -e
          mkdir -p app/src/main/java/com/primo/tv app/src/main/assets app/src/main/res/drawable
          cat > settings.gradle <<'XEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'PRIMO'
          include ':app'
          XEOF
          cat > build.gradle <<'XEOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          XEOF
          cat > gradle.properties <<'XEOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          XEOF
          cat > app/build.gradle <<'XEOF'
          plugins { id 'com.android.application' }
          def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
          android {
              namespace 'com.primo.tv'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.primo.tv'
                  minSdk 22
                  targetSdk 34
                  versionCode run
                  versionName rootProject.file('version.txt').text.trim()
              }
              signingConfigs {
                  primo { storeFile file('primo.jks'); storePassword 'primoprimo'; keyAlias 'primo'; keyPassword 'primoprimo' }
              }
              buildTypes {
                  release { minifyEnabled false; signingConfig signingConfigs.primo }
                  debug { signingConfig signingConfigs.primo }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
              implementation 'androidx.media3:media3-ui:1.4.1'
          }
          XEOF
          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="PRIMO"
                  android:icon="@drawable/icon"
                  android:banner="@drawable/banner"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:screenOrientation="landscape"
                      android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode" />
              </application>
          </manifest>
          XEOF
          cat > app/src/main/java/com/primo/tv/MainActivity.java <<'XEOF'
          package com.primo.tv;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON | WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  setContentView(web);
                  registerInstallReceiver();
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setUserAgentString("PRIMO/1.0 (Linux; Android)");
                  web.setWebChromeClient(new WebChromeClient() {
                      // No grey "play" placeholder while a channel is tuning
                      @Override public android.graphics.Bitmap getDefaultVideoPoster() {
                          return android.graphics.Bitmap.createBitmap(1, 1, android.graphics.Bitmap.Config.ARGB_8888);
                      }
                  });
                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  web.requestFocus();
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
                  hideBars();
              }

              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              private class Bridge {
                  private final java.util.concurrent.ConcurrentHashMap<String, String> bodies = new java.util.concurrent.ConcurrentHashMap<>();

                  /** Hand a stored reply to the page (much cheaper than pasting megabytes into a script). */
                  @JavascriptInterface
                  public String take(String id) { String b = bodies.remove(id); return b == null ? "" : b; }

                  /** Like httpGet, but a JSON list is cut down to the named fields before the page sees it. */
                  @JavascriptInterface
                  public void httpGetSlim(final String id, final String url, final String fields) { fetch(id, url, fields); }

                  @JavascriptInterface
                  public void exit() {
                      runOnUiThread(new Runnable() { public void run() { finish(); } });
                  }

                  /** Play a movie or episode in the native ExoPlayer (handles MKV, AC3/EAC3 audio and buffering). */
                  @JavascriptInterface
                  public void playNative(final String url, final String title, final double startMs, final String id) {
                      runOnUiThread(new Runnable() { public void run() {
                          Intent i = new Intent(MainActivity.this, PlayerActivity.class);
                          i.putExtra("url", url);
                          i.putExtra("title", title);
                          i.putExtra("start", (long) startMs);
                          i.putExtra("id", id);
                          startActivityForResult(i, 42);
                      }});
                  }

                  // ---------------------------------------------------------------- in-app updates
                  @JavascriptInterface
                  public int versionCode() {
                      try { return getPackageManager().getPackageInfo(getPackageName(), 0).versionCode; } catch (Exception e) { return 0; }
                  }

                  @JavascriptInterface
                  public String versionName() {
                      try { return getPackageManager().getPackageInfo(getPackageName(), 0).versionName; } catch (Exception e) { return "?"; }
                  }

                  /** Looks at the latest GitHub release; if it's newer, optionally downloads and installs it. */
                  @JavascriptInterface
                  public void checkUpdate(final boolean install) {
                      new Thread(new Runnable() { public void run() { runUpdate(install); } }).start();
                  }

                  /** GET a URL natively (follows redirects, ignores CORS) and hand the result back to JS. */
                  @JavascriptInterface
                  public void httpGet(final String id, final String url) { fetch(id, url, null); }

                  private void fetch(final String id, final String url, final String fields) {
                      new Thread(new Runnable() { public void run() {
                          int code = 0;
                          String body = "";
                          String err = "";
                          java.net.HttpURLConnection c = null;
                          try {
                              String cur = url;
                              for (int hop = 0; hop < 6; hop++) {
                                  c = (java.net.HttpURLConnection) new java.net.URL(cur).openConnection();
                                  c.setInstanceFollowRedirects(false);
                                  c.setConnectTimeout(15000);
                                  c.setReadTimeout(45000);
                                  // App identity (the provider turns away web browsers)
                                  c.setRequestProperty("User-Agent", "PRIMO/1.0 (Linux; Android)");
                                  c.setRequestProperty("Accept", "*/*");
                                  code = c.getResponseCode();
                                  String loc = c.getHeaderField("Location");
                                  if (code >= 300 && code < 400 && loc != null) {
                                      cur = new java.net.URL(new java.net.URL(cur), loc).toString();
                                      c.disconnect();
                                      continue;
                                  }
                                  break;
                              }
                              java.io.InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                              if (in != null) {
                                  java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream();
                                  byte[] buf = new byte[65536];
                                  int n;
                                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                                  in.close();
                                  body = new String(out.toByteArray(), "UTF-8");
                              }
                          } catch (Exception e) {
                              err = e.getClass().getSimpleName() + (e.getMessage() == null ? "" : ": " + e.getMessage());
                          } finally {
                              if (c != null) c.disconnect();
                          }
                          if (fields != null && code < 400 && body.length() > 0 && body.charAt(0) == '[') {
                              try {
                                  String[] keep = fields.split(",");
                                  org.json.JSONArray src = new org.json.JSONArray(body);
                                  StringBuilder sb = new StringBuilder(body.length() / 3);
                                  sb.append('[');
                                  for (int i = 0; i < src.length(); i++) {
                                      org.json.JSONObject o = src.optJSONObject(i);
                                      if (o == null) continue;
                                      if (sb.length() > 1) sb.append(',');
                                      sb.append('{');
                                      boolean first = true;
                                      for (String k : keep) {
                                          if (!o.has(k) || o.isNull(k)) continue;
                                          if (!first) sb.append(',');
                                          first = false;
                                          sb.append(org.json.JSONObject.quote(k)).append(':');
                                          Object v = o.opt(k);
                                          if (v instanceof Number || v instanceof Boolean) sb.append(v.toString());
                                          else sb.append(org.json.JSONObject.quote(String.valueOf(v)));
                                      }
                                      sb.append('}');
                                  }
                                  sb.append(']');
                                  body = sb.toString();
                              } catch (Exception ignored) { }
                          }
                          bodies.put(id, body);
                          final String js = "window.__httpDone&&__httpDone(" + org.json.JSONObject.quote(id) + "," + code + ",null,"
                                  + org.json.JSONObject.quote(err) + ")";
                          runOnUiThread(new Runnable() { public void run() { web.evaluateJavascript(js, null); } });
                      }}).start();
                  }
              }

              private static final String RELEASES = "https://api.github.com/repos/DaveG27/solar-iptv/releases/latest";
              private static final String INSTALL_ACTION = "com.primo.tv.INSTALL_RESULT";
              private volatile boolean updating = false;
              private android.content.BroadcastReceiver installReceiver;

              private void upd(final String state, final String msg) {
                  final String js = "window.onUpdate&&onUpdate(" + org.json.JSONObject.quote(state) + "," + org.json.JSONObject.quote(msg == null ? "" : msg) + ")";
                  runOnUiThread(new Runnable() { public void run() { if (web != null) web.evaluateJavascript(js, null); } });
              }

              private void runUpdate(boolean install) {
                  if (updating) { upd("busy", ""); return; }
                  updating = true;
                  try {
                      java.net.HttpURLConnection c = (java.net.HttpURLConnection) new java.net.URL(RELEASES).openConnection();
                      c.setConnectTimeout(15000); c.setReadTimeout(20000);
                      c.setRequestProperty("User-Agent", "PRIMO");
                      c.setRequestProperty("Accept", "application/vnd.github+json");
                      java.io.InputStream in = c.getInputStream();
                      java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                      byte[] b = new byte[16384]; int n;
                      while ((n = in.read(b)) > 0) bo.write(b, 0, n);
                      in.close(); c.disconnect();
                      org.json.JSONObject rel = new org.json.JSONObject(new String(bo.toByteArray(), "UTF-8"));
                      String tag = rel.optString("tag_name", "");
                      int latest = 0;
                      try { latest = Integer.parseInt(tag.replaceAll("[^0-9]", "")); } catch (Exception ignored) { }
                      String apk = null;
                      org.json.JSONArray assets = rel.optJSONArray("assets");
                      for (int i = 0; assets != null && i < assets.length(); i++) {
                          String u = assets.getJSONObject(i).optString("browser_download_url", "");
                          if (u.endsWith(".apk")) { apk = u; break; }
                      }
                      int mine = getPackageManager().getPackageInfo(getPackageName(), 0).versionCode;
                      if (apk == null || latest <= mine) { upd("none", ""); return; }
                      java.util.regex.Matcher vm = java.util.regex.Pattern.compile("(\\d+(?:\\.\\d+)+)").matcher(rel.optString("name", ""));
                      String shown = vm.find() ? vm.group(1) : ("build " + latest);
                      if (!install) { upd("available", shown); return; }
                      if (android.os.Build.VERSION.SDK_INT >= 26 && !getPackageManager().canRequestPackageInstalls()) {
                          upd("permission", "");
                          startActivity(new android.content.Intent(android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                  android.net.Uri.parse("package:" + getPackageName())).addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK));
                          return;
                      }
                      java.io.File f = new java.io.File(getCacheDir(), "update.apk");
                      java.net.HttpURLConnection d = (java.net.HttpURLConnection) new java.net.URL(apk).openConnection();
                      d.setInstanceFollowRedirects(true);
                      d.setConnectTimeout(20000); d.setReadTimeout(60000);
                      d.setRequestProperty("User-Agent", "PRIMO");
                      long total = d.getContentLength(), done = 0; int last = -1;
                      java.io.InputStream di = d.getInputStream();
                      java.io.OutputStream fo = new java.io.FileOutputStream(f);
                      byte[] buf = new byte[65536];
                      while ((n = di.read(buf)) > 0) {
                          fo.write(buf, 0, n); done += n;
                          int pct = total > 0 ? (int) (done * 100 / total) : -1;
                          if (pct != last && pct % 5 == 0) { last = pct; upd("progress", String.valueOf(pct)); }
                      }
                      fo.close(); di.close(); d.disconnect();
                      upd("installing", shown);
                      android.content.pm.PackageInstaller pi = getPackageManager().getPackageInstaller();
                      int sid = pi.createSession(new android.content.pm.PackageInstaller.SessionParams(
                              android.content.pm.PackageInstaller.SessionParams.MODE_FULL_INSTALL));
                      android.content.pm.PackageInstaller.Session ses = pi.openSession(sid);
                      java.io.OutputStream so = ses.openWrite("base.apk", 0, f.length());
                      java.io.InputStream fi = new java.io.FileInputStream(f);
                      while ((n = fi.read(buf)) > 0) so.write(buf, 0, n);
                      fi.close(); ses.fsync(so); so.close();
                      int fl = android.app.PendingIntent.FLAG_UPDATE_CURRENT;
                      if (android.os.Build.VERSION.SDK_INT >= 31) fl |= android.app.PendingIntent.FLAG_MUTABLE;
                      android.app.PendingIntent pend = android.app.PendingIntent.getBroadcast(this, sid,
                              new android.content.Intent(INSTALL_ACTION).setPackage(getPackageName()), fl);
                      ses.commit(pend.getIntentSender());
                      ses.close();
                  } catch (Exception e) {
                      upd("error", e.getClass().getSimpleName() + (e.getMessage() == null ? "" : ": " + e.getMessage()));
                  } finally {
                      updating = false;
                  }
              }

              private void registerInstallReceiver() {
                  installReceiver = new android.content.BroadcastReceiver() {
                      @Override public void onReceive(android.content.Context ctx, android.content.Intent it) {
                          int st = it.getIntExtra(android.content.pm.PackageInstaller.EXTRA_STATUS, -999);
                          if (st == android.content.pm.PackageInstaller.STATUS_PENDING_USER_ACTION) {
                              android.content.Intent confirm = it.getParcelableExtra(android.content.Intent.EXTRA_INTENT);
                              if (confirm != null) {
                                  confirm.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
                                  try { startActivity(confirm); } catch (Exception ignored) { }
                              }
                          } else if (st != android.content.pm.PackageInstaller.STATUS_SUCCESS) {
                              String m = it.getStringExtra(android.content.pm.PackageInstaller.EXTRA_STATUS_MESSAGE);
                              upd("error", m == null ? "install cancelled" : m);
                          }
                      }
                  };
                  android.content.IntentFilter flt = new android.content.IntentFilter(INSTALL_ACTION);
                  if (android.os.Build.VERSION.SDK_INT >= 33) registerReceiver(installReceiver, flt, android.content.Context.RECEIVER_NOT_EXPORTED);
                  else registerReceiver(installReceiver, flt);
              }

              private void sendKey(String k) {
                  web.evaluateJavascript("window.handle&&handle('" + k + "')", null);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent e) {
                  String k = null;
                  switch (e.getKeyCode()) {
                      case KeyEvent.KEYCODE_BACK: k = "back"; break;
                      case KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE:
                      case KeyEvent.KEYCODE_MEDIA_PLAY:
                      case KeyEvent.KEYCODE_MEDIA_PAUSE: k = "play"; break;
                      case KeyEvent.KEYCODE_CHANNEL_UP:
                      case KeyEvent.KEYCODE_PAGE_UP: k = "chup"; break;
                      case KeyEvent.KEYCODE_CHANNEL_DOWN:
                      case KeyEvent.KEYCODE_PAGE_DOWN: k = "chdown"; break;
                      case KeyEvent.KEYCODE_MEDIA_FAST_FORWARD: k = "right"; break;
                      case KeyEvent.KEYCODE_MEDIA_REWIND: k = "left"; break;
                      case KeyEvent.KEYCODE_GUIDE: k = "guide"; break;
                      default: break;
                  }
                  if (k != null) {
                      if (e.getAction() == KeyEvent.ACTION_UP) sendKey(k);
                      return true;
                  }
                  return super.dispatchKeyEvent(e);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent d) {
                  super.onActivityResult(req, res, d);
                  if (req != 42 || d == null || web == null) return;
                  String err = d.getStringExtra("err");
                  String js = "window.nativeDone&&nativeDone(" + org.json.JSONObject.quote(String.valueOf(d.getStringExtra("id"))) + ","
                          + d.getLongExtra("pos", 0) + "," + d.getLongExtra("dur", 0) + ","
                          + (err == null ? "null" : org.json.JSONObject.quote(err)) + ")";
                  web.evaluateJavascript(js, null);
              }

              @Override protected void onSaveInstanceState(Bundle out) { super.onSaveInstanceState(out); web.saveState(out); }
              @Override protected void onResume() { super.onResume(); web.onResume(); hideBars(); }
              @Override protected void onPause() { web.onPause(); super.onPause(); }
              @Override protected void onDestroy() { try { if (installReceiver != null) unregisterReceiver(installReceiver); } catch (Exception ignored) { } if (web != null) web.destroy(); super.onDestroy(); }
              @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
          }
          XEOF
          cat > app/src/main/java/com/primo/tv/PlayerActivity.java <<'XEOF'
          package com.primo.tv;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.media3.common.AudioAttributes;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.DefaultLoadControl;
          import androidx.media3.exoplayer.DefaultRenderersFactory;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.PlayerView;

          @androidx.annotation.OptIn(markerClass = androidx.media3.common.util.UnstableApi.class)
          public class PlayerActivity extends Activity {
              private static final String UA = "PRIMO/1.0 (Linux; Android)";
              private ExoPlayer player;
              private PlayerView view;
              private String id;
              private String err;
              private boolean finished;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON | WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  Intent it = getIntent();
                  String url = it.getStringExtra("url");
                  String title = it.getStringExtra("title");
                  long start = it.getLongExtra("start", 0);
                  id = it.getStringExtra("id");

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  view = new PlayerView(this);
                  root.addView(view, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  final TextView tv = new TextView(this);
                  tv.setText(title == null ? "" : title);
                  tv.setTextColor(Color.WHITE);
                  tv.setTextSize(22);
                  tv.setPadding(56, 40, 56, 0);
                  tv.setShadowLayer(10, 0, 0, Color.BLACK);
                  root.addView(tv, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP));
                  setContentView(root);
                  view.setControllerVisibilityListener(new PlayerView.ControllerVisibilityListener() {
                      @Override public void onVisibilityChanged(int visibility) { tv.setVisibility(visibility); }
                  });

                  DefaultHttpDataSource.Factory http = new DefaultHttpDataSource.Factory()
                          .setUserAgent(UA)
                          .setAllowCrossProtocolRedirects(true)
                          .setConnectTimeoutMs(15000)
                          .setReadTimeoutMs(30000);
                  DefaultLoadControl load = new DefaultLoadControl.Builder()
                          .setBufferDurationsMs(30000, 120000, 2500, 5000)
                          .build();
                  DefaultRenderersFactory renderers = new DefaultRenderersFactory(this)
                          .setEnableDecoderFallback(true)
                          .setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_ON);
                  player = new ExoPlayer.Builder(this, renderers)
                          .setMediaSourceFactory(new DefaultMediaSourceFactory(http))
                          .setLoadControl(load)
                          .setSeekBackIncrementMs(10000)
                          .setSeekForwardIncrementMs(30000)
                          .build();
                  player.setAudioAttributes(new AudioAttributes.Builder().setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MOVIE).build(), true);
                  player.addListener(new Player.Listener() {
                      @Override public void onPlayerError(PlaybackException e) {
                          err = e.getErrorCodeName() + (e.getCause() != null && e.getCause().getMessage() != null ? " (" + e.getCause().getMessage() + ")" : "");
                          Toast.makeText(PlayerActivity.this, "Can't play this: " + err, Toast.LENGTH_LONG).show();
                          done();
                      }
                      @Override public void onPlaybackStateChanged(int state) {
                          if (state == Player.STATE_ENDED) done();
                      }
                  });
                  view.setPlayer(player);
                  view.setShowBuffering(PlayerView.SHOW_BUFFERING_WHEN_PLAYING);
                  view.setKeepScreenOn(true);
                  player.setMediaItem(MediaItem.fromUri(Uri.parse(url)), Math.max(0, start));
                  player.prepare();
                  player.setPlayWhenReady(true);
              }

              private void done() {
                  if (finished) return;
                  finished = true;
                  Intent r = new Intent();
                  r.putExtra("id", id);
                  if (player != null) {
                      r.putExtra("pos", player.getCurrentPosition());
                      long d = player.getDuration();
                      r.putExtra("dur", d == C.TIME_UNSET ? 0L : d);
                  }
                  if (err != null) r.putExtra("err", err);
                  setResult(RESULT_OK, r);
                  finish();
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent e) {
                  if (e.getKeyCode() == KeyEvent.KEYCODE_BACK) {
                      if (e.getAction() == KeyEvent.ACTION_UP) {
                          if (view.isControllerFullyVisible()) view.hideController(); else done();
                      }
                      return true;
                  }
                  if (!view.isControllerFullyVisible() && e.getAction() == KeyEvent.ACTION_DOWN) {
                      int k = e.getKeyCode();
                      if (k == KeyEvent.KEYCODE_DPAD_RIGHT) { player.seekForward(); view.showController(); return true; }
                      if (k == KeyEvent.KEYCODE_DPAD_LEFT) { player.seekBack(); view.showController(); return true; }
                  }
                  return view.dispatchKeyEvent(e) || super.dispatchKeyEvent(e);
              }

              @Override protected void onStop() { super.onStop(); if (player != null && !finished) player.pause(); }
              @Override protected void onDestroy() { if (player != null) { player.release(); player = null; } super.onDestroy(); }
              @Override public void onWindowFocusChanged(boolean f) {
                  super.onWindowFocusChanged(f);
                  if (f) getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }
          }
          XEOF
          cp index.html app/src/main/assets/index.html
          if [ -z "$PROVIDER_SERVER" ]; then echo "Missing PROVIDER_SERVER secret"; exit 1; fi
          sed -i "s#__PROVIDER_SERVER__#${PROVIDER_SERVER%/}#" app/src/main/assets/index.html
          if grep -q "__PROVIDER_SERVER__" app/src/main/assets/index.html; then echo "Server not inserted"; exit 1; fi
          curl -fsSL https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js -o app/src/main/assets/hls.min.js || echo 'hls.js download failed - app will load it online'
          echo '' | base64 -d > app/src/main/res/drawable/banner.png
          echo '' | base64 -d > app/src/main/res/drawable/icon.png
          echo '' | base64 -d > app/primo.jks

      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PRIMO.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PRIMO
          path: PRIMO.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PRIMO ${{ steps.v.outputs.version }}
          body: "PRIMO ${{ steps.v.outputs.version }} (build ${{ github.run_number }})"
          make_latest: true
          files: PRIMO.apk
